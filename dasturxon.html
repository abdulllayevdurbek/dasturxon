<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dasturxon — restoranlar uchun buyurtma ilovasi</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F1;--card:#fff;--ink:#14261F;--mute:#5C6E65;--line:#DCE4DD;--g:#0E4D3A;--g2:#0A3629;--sf:#F4B31D;--pg:#C3302F;--onsf:#2A1D00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1713;--card:#15241E;--ink:#EAF1EC;--mute:#97ABA1;--line:#27382F;--g:#1D7A5B;--g2:#0A3629;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1713;--card:#15241E;--ink:#EAF1EC;--mute:#97ABA1;--line:#27382F;--g:#1D7A5B;--g2:#0A3629;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Unbounded,"Trebuchet MS",sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--sf);outline-offset:2px}
.top{background:var(--g2);color:#fff;position:sticky;top:0;z-index:5;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;background:var(--sf);color:var(--onsf);border-radius:10px;padding:2px 7px}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{background:none;color:#fff;padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px}
.seg button.on{background:var(--sf);color:var(--onsf)}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:13px;background:var(--bg);border:1px solid var(--line)}.st.new{background:var(--sf);color:var(--onsf);border-color:var(--sf)}.st.done{background:var(--g);color:#fff;border-color:var(--g)}.st.x{color:var(--pg)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}a.btn{display:block;text-align:center;text-decoration:none}
@media (max-width:520px){.seg button{padding:7px 9px;font-size:13px}.top{padding:10px 10px}}
main{max-width:980px;margin:0 auto;padding:16px 16px 120px}
.hero{background:var(--g);color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(22px,5vw,34px);max-width:560px}
.hero p{max-width:480px;opacity:.9;margin:10px 0 0}
.hero:after{content:"🍲";position:absolute;right:14px;bottom:-14px;font-size:96px;opacity:.9}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;width:100%;display:block}
.rc .ban{height:92px;display:flex;align-items:center;justify-content:center;font-size:50px}
.rc .bd{padding:14px 16px}.rc h3{font-size:16px}.rc small{color:var(--mute)}
.back{background:none;color:var(--g);font-weight:800;padding:6px 0;margin-bottom:8px}
:root[data-theme="dark"] .back{color:var(--sf)}
.rh{border-radius:22px;padding:20px;color:#fff;display:flex;gap:14px;align-items:center;margin-bottom:14px}
.rh .em{font-size:46px}.rh h2{font-size:22px}.rh p{margin:4px 0 0;opacity:.92}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:56px;background:var(--bg);z-index:3}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dish{background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;gap:14px;padding:12px;align-items:stretch}
.dish .pic{flex:0 0 96px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:50px}
.dish .inf{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.dish h3{font-size:15px}.dish p{margin:0;color:var(--mute);font-size:14px}
.dish .row{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:800;font-size:17px}
.add{background:var(--sf);color:var(--onsf);font-weight:800;padding:9px 18px;border-radius:999px}
.step{display:flex;align-items:center;background:var(--g);color:#fff;border-radius:999px}
.step button{background:none;color:#fff;width:38px;height:38px;font-size:20px;font-weight:800}
.step b{min-width:22px;text-align:center}
.off{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar button{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;background:var(--pg);color:#fff;border-radius:18px;padding:16px 20px;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.bar button{animation:none}}
.ov{position:fixed;inset:0;background:rgba(5,15,11,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet.c{border-radius:24px;margin:auto 16px;align-self:center;text-align:center}
.sheet h2{font-size:19px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fld{display:block;margin:10px 0 0;font-weight:800;font-size:14px}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:400}
.btn{background:var(--g);color:#fff;font-weight:800;padding:13px 20px;border-radius:14px;width:100%;margin-top:14px}
.btn.sf{background:var(--sf);color:var(--onsf)}.btn.gh{background:none;color:var(--mute);margin-top:4px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.panel h2{font-size:17px;margin-bottom:6px}
.two{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
.mi{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mi .e{font-size:28px}.mi .t{flex:1;min-width:0}.mi small{color:var(--mute)}
.mini{background:var(--bg);border:1px solid var(--line);padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px}
.mini.d{color:var(--pg)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-weight:800}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.hot{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 6px;margin-bottom:18px}.hot h2{font-size:16px;margin-bottom:6px}.hr{display:flex;align-items:center;gap:12px;width:100%;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--line)}.no{font-family:Unbounded,sans-serif;font-size:18px;width:24px;color:var(--pg)}.hot .empty{padding:14px 0}
.dish .pic{min-height:96px}.mi .th{width:44px;height:44px;border-radius:10px;background:center/cover;flex:none}
.credit{position:fixed;left:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:999px;z-index:1;pointer-events:none}
@media (max-width:520px){.two{grid-template-columns:1fr}.logo span{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i>D</i><span>Dasturxon</span></div>
  <div class="seg" id="nav"></div>
</header>
<main id="app"></main>
<div id="layer"></div>
<div class="credit">Yaratuvchi: Abdullayev Durbek</div>
<script>
var OP_TG="davronvicch",OP_TEL="938330910",KEY="dasturxon_v1";
var COL=["#B5382F","#0E6B52","#C47A0C","#5B3E9E","#1F6F9A","#A23B72"];
function seed(){return {rs:[
{id:"r1",name:"Choyxona Navro‘z",emoji:"🍖",color:COL[0],tg:OP_TG,tel:OP_TEL,about:"Milliy taomlar, tandirdan issiq non",dishes:[
{id:"d1",n:"Osh (palov)",p:45000,c:"Asosiy taom",e:"🍛",d:"Devzira guruchi, mol go‘shti, sabzi, nohat",on:1},
{id:"d2",n:"Lag‘mon",p:38000,c:"Sho‘rva",e:"🍜",d:"Qo‘lda cho‘zilgan xamir, sabzavotli sho‘rva",on:1},
{id:"d3",n:"Shashlik (3 ta)",p:42000,c:"Asosiy taom",e:"🍢",d:"Ko‘mirda pishirilgan mol go‘shti",on:1},
{id:"d4",n:"Somsa",p:12000,c:"Pishiriq",e:"🥟",d:"Tandirda pishgan, go‘shtli",on:1},
{id:"d5",n:"Ko‘k choy",p:8000,c:"Ichimlik",e:"🍵",d:"Choynakda",on:1},{id:"d9",n:"Non",p:3000,c:"Qo‘shimcha",e:"🍞",d:"Tandir noni",on:1},{id:"d10",n:"Suv 0.5 l",p:4000,c:"Ichimlik",e:"💧",d:"Gazsiz",on:1}]},
{id:"r2",name:"Bahor Kafe",emoji:"🥗",color:COL[1],tg:OP_TG,tel:OP_TEL,about:"Yengil ovqatlar va shirinliklar",dishes:[
{id:"d6",n:"Omlet va non",p:24000,c:"Asosiy taom",e:"🍳",d:"3 ta tuxum, pomidor, ko‘kat",on:1},
{id:"d7",n:"Sezar salati",p:36000,c:"Salat",e:"🥗",d:"Tovuq filesi, parmezan",on:1},
{id:"d8",n:"Cheesecake",p:28000,c:"Shirinlik",e:"🍰",d:"Qulupnay sousi bilan",on:1}]}]}}
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.rs)S=seed();S.users=S.users||[];S.orders=S.orders||[];var ME=null;try{ME=localStorage.getItem(KEY+"_me")}catch(e){}
var SRV=false,pt=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(SRV&&V.mode==="r"){clearTimeout(pt);pt=setTimeout(push,500)}}
function api(p,b){return fetch(p,{method:b?"POST":"GET",headers:{"content-type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){if(r.status===401&&V.mode==="r")doLogout();return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function push(){var r=R(V.mrid);if(!r)return;api("/api/owner/sync",{restaurant:r}).then(function(s){s.dishes.forEach(function(d){var l=r.dishes.find(function(x){return x.id===d.id});if(l)l.img=d.img});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},function(){toast("Server bilan aloqa yo‘q. O‘zgarishlar saqlanmadi")})}
function doLogout(){ME=null;try{localStorage.removeItem(KEY+"_me")}catch(e){}V.mode="";V.rid=null;V.cart={};V.mrid=null;V.bot=null;$("#layer").innerHTML="";render()}
function adoptOwner(m){var r=m.restaurant,i=S.rs.findIndex(function(x){return x.id===r.id});if(i<0)S.rs.push(r);else S.rs[i]=r;V.bot=m.bot;V.mrid=r.id}
function ownOrders(u){if(!SRV)return S.orders.filter(function(o){return o.rid===u.rid});return(V.so||[]).map(function(o){return{id:"s"+o.no,no:o.no,rid:u.rid,rn:o.restaurant,name:o.name,tel:o.tel,ctg:"",addr:o.addr,loc:o.loc,note:o.note,items:o.items,sum:o.sum,st:o.status,t:o.t}})}
var V={mode:"",tab:"home",rid:null,cat:"Hammasi",cart:{},mrid:null,auth:"login",role:"c"};function me(){return S.users.find(function(u){return u.id===ME})}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return Number(n).toLocaleString("ru-RU")+" soʻm"}
function R(id){return S.rs.find(function(r){return r.id===id})}
function cartItems(){var r=R(V.rid);if(!r)return[];return r.dishes.filter(function(d){return V.cart[d.id]}).map(function(d){return{d:d,q:V.cart[d.id]}})}
function cartCount(){return cartItems().reduce(function(a,x){return a+x.q},0)}
function cartSum(){return cartItems().reduce(function(a,x){return a+x.q*x.d.p},0)}
function toast(t){var el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},2200)}
function uid(){return "x"+Math.random().toString(36).slice(2,9)}

function render(){
  var u=me();$("#nav").innerHTML=u?navHtml(u):"";
  var h=!u?authView():u.role==="c"?(V.tab==="my"?myView(u):V.rid?menuView():listView()):(V.tab==="menu"?panelView():ordersView(u));
  $("#app").innerHTML=h;
  var n=u&&V.mode==="c"&&V.rid&&V.tab!=="my"?cartCount():0;
  var b=$("#bar");if(b)b.remove();
  if(n>0){var d=document.createElement("div");d.id="bar";d.className="bar";
    d.innerHTML='<button data-a="cart"><span>Savatcha · '+n+' ta</span><span>'+money(cartSum())+'</span></button>';document.body.appendChild(d)}
}
function listView(){
  var h='<section class="hero"><h1>Bugun nima yeysiz?</h1><p>Restoranni tanlang, taomni belgilang — buyurtmangizni operator Telegramda qabul qiladi.</p></section>';
  if(!S.rs.length)return h+'<p class="empty">Hozircha restoran yo‘q. “Restoran paneli”dan o‘zingiznikini qo‘shing.</p>';
  h+=hotHtml()+'<h2 style="margin:6px 0 12px;font-size:18px">Restoranlar</h2><div class="grid">';
  S.rs.forEach(function(r){var k=r.dishes.filter(function(d){return d.on}).length;
    h+='<button class="rc" data-a="open" data-id="'+r.id+'"><div class="ban" style="background:'+r.color+'">'+esc(r.emoji)+'</div><div class="bd"><h3>'+esc(r.name)+'</h3><small>'+esc(r.about)+'</small><br><small><b>'+k+'</b> ta taom</small></div></button>'});
  return h+'</div>';
}
function menuView(){
  var r=R(V.rid);if(!r){V.rid=null;return listView()}
  var cats=["Hammasi"];r.dishes.forEach(function(d){if(d.on&&cats.indexOf(d.c)<0)cats.push(d.c)});
  if(cats.indexOf(V.cat)<0)V.cat="Hammasi";
  var h='<button class="back" data-a="back">← Restoranlar</button>';
  h+='<div class="rh" style="background:'+r.color+'"><div class="em">'+esc(r.emoji)+'</div><div><h2>'+esc(r.name)+'</h2><p>'+esc(r.about)+'</p>'+(locUrl(r.loc)?'<p><a href="'+esc(locUrl(r.loc))+'" target="_blank" rel="noopener" style="color:#fff;font-weight:800">📍 Xaritada ko‘rish</a></p>':'')+(r.bot?'<p><a href="https://t.me/'+esc(r.bot)+'" target="_blank" rel="noopener" style="color:#fff;font-weight:800">🔔 Yangiliklarga obuna bo‘lish</a></p>':'')+'</div></div>';
  h+='<div class="chips">'+cats.map(function(c){return'<button class="chip'+(c===V.cat?" on":"")+'" data-a="cat" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("")+'</div><div class="grid">';
  var list=r.dishes.filter(function(d){return d.on&&(V.cat==="Hammasi"||d.c===V.cat)});
  if(!list.length)return h+'</div><p class="empty">Bu bo‘limda hozircha taom yo‘q.</p>';
  list.forEach(function(d){var q=V.cart[d.id]||0;
    h+='<div class="dish"><div class="pic" style="'+(d.img?'background:url('+esc(d.img)+') center/cover':'background:'+r.color+'22')+'">'+(d.img?'':esc(d.e))+'</div><div class="inf"><h3>'+esc(d.n)+'</h3><p>'+esc(d.d)+'</p>'+(d.ing?'<p><small><b>Tarkibi:</b> '+esc(d.ing)+'</small></p>':'')+'<div class="row"><span class="price">'+money(d.p)+'</span>'+
    (q?'<div class="step"><button data-a="dec" data-id="'+d.id+'" aria-label="Kamaytirish">−</button><b>'+q+'</b><button data-a="inc" data-id="'+d.id+'" aria-label="Ko‘paytirish">+</button></div>':'<button class="add" data-a="inc" data-id="'+d.id+'">Qo‘shish</button>')+'</div></div></div>'});
  return h+'</div>';
}
function botPanel(){
  if(!SRV)return '<div class="panel"><h2>Telegram bot</h2><p><small>Bot va yangiliklar server bilan ishlaydi. Saytni <b>localhost:3000</b> orqali oching (server.js ishlab turishi kerak).</small></p></div>';
  var b=V.bot||{};
  return '<div class="panel"><h2>Telegram bot (faqat shu restoran uchun)</h2><p><small>'+(b.name?'Ulangan: <b>@'+esc(b.name)+'</b>':'Hali ulanmagan. @BotFather da /newbot orqali shu restoran uchun bot yarating va tokenni yozing.')+'</small></p><label class="fld">Bot tokeni<input id="bt" autocomplete="off" placeholder="'+(b.tail?'•••• '+esc(b.tail)+' (o‘zgartirmasangiz bo‘sh qoldiring)':'123456789:ABC...')+'"></label><label class="fld">Operator Telegram ID raqamlari<input id="bo" value="'+esc(b.ops||"")+'" placeholder="123456789"></label><label class="fld">Kuryer Telegram ID raqamlari<input id="bc" value="'+esc(b.couriers||"")+'" placeholder="987654321"></label><p><small>ID olish: botga /id deb yozing. Bir nechta bo‘lsa vergul bilan ajrating.</small></p><button class="btn" data-a="botsave">Saqlash va botni yoqish</button></div><div class="panel"><h2>Yangilik yuborish</h2><p><small>Obunachilar: <b>'+(b.subs||0)+'</b>. Mijoz botga /start yozsa obuna bo‘ladi.</small></p><label class="fld">Yangilik matni<textarea id="nw" rows="3"></textarea></label><button class="btn sf" data-a="news">Hammaga yuborish</button></div>'}
function panelView(){
  var r=R(V.mrid);
  var h='<section class="hero"><h1>Restoran paneli</h1><p>Restoraningizni qo‘shing, taomnomani to‘ldiring. Mijozlar uni darhol ko‘radi.</p></section>';
  
  if(!r)return h;
  h+='<div class="panel"><h2>Restoran ma’lumotlari</h2><div class="two"><label class="fld">Nomi<input data-r="name" value="'+esc(r.name)+'"></label><label class="fld">Belgi (emoji)<input data-r="emoji" value="'+esc(r.emoji)+'" maxlength="4"></label><label class="fld">Operator Telegrami<input data-r="tg" value="@'+esc(r.tg)+'"></label><label class="fld">Telefon<input data-r="tel" value="'+esc(r.tel)+'"></label></div><label class="fld">Qisqa tavsif<input data-r="about" value="'+esc(r.about)+'"></label><label class="fld">Restoran joylashuvi (xarita havolasi yoki koordinata)<input data-r="loc" value="'+esc(r.loc||"")+'" placeholder="41.3111, 69.2797"></label><button class="mini" data-a="rgps" style="margin-top:8px">📍 Hozirgi joylashuvimni belgilash</button>'+
  '<div class="chips" style="position:static">'+COL.map(function(c){return'<button class="chip" data-a="color" data-c="'+c+'" style="background:'+c+';border-color:'+(c===r.color?"var(--ink)":c)+';border-width:3px;width:40px;height:34px" aria-label="Rang"></button>'}).join("")+'</div></div>';
  h+=botPanel();
  h+='<div class="panel"><h2>Yangi taom</h2><div class="two"><label class="fld">Nomi<input id="nn"></label><label class="fld">Narxi (soʻm)<input id="np" type="number" inputmode="numeric"></label><label class="fld">Bo‘lim<input id="nc" list="cl" placeholder="Asosiy taom, Salat, Ichimlik..."></label><label class="fld">Emoji<input id="ne" maxlength="4" value="🍽"></label></div><datalist id="cl"><option>Asosiy taom<option>Sho‘rva<option>Salat<option>Fast-food<option>Pishiriq<option>Shirinlik<option>Ichimlik<option>Non<option>Qo‘shimcha</datalist><small style="color:var(--mute)">Suv, non, sous kabilarni «Qo‘shimcha», «Ichimlik» yoki «Non» bo‘limiga qo‘shing: mijozga buyurtma oynasida taklif qilinadi.</small><label class="fld">Tavsif<input id="nd"></label><label class="fld">Tarkibi (ichida nimalar bor)<input id="ni" placeholder="Guruch, mol go‘shti, sabzi, piyoz..."></label><label class="fld">Rasm<input id="nf" type="file" accept="image/*"></label><small id="nfs" style="color:var(--mute)"></small><button class="btn" data-a="adddish">Taomni qo‘shish</button></div>';
  h+='<div class="panel"><h2>Taomnoma ('+r.dishes.length+')</h2>';
